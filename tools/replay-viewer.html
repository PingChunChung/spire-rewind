function lossOf(r){let f=r.snapshots?.frames||[],sum=0,valid=false;for(let i=1;i<f.length;i++){let a=f[i-1].players?.[0]?.hp,b=f[i].players?.[0]?.hp;if(Number.isFinite(a)&&Number.isFinite(b)){valid=true;sum+=Math.max(0,a-b)}}return valid?{v:sum,m:r.metadata,id:r.id}:null}
function translated(v){const alias={Combat:'Monster',Merchant:'Shop',Unassigned:'Unknown',Ancient:'Event',None:'Map'};if((alias[v]||v)==='Map')return {zht:'地圖',zhs:'地图',eng:'Map'}[lang];return labels[lang][alias[v]||v]||aiLabels[lang][v]||v||strings[lang].unknown}
let floors=[...new Set([...cps,...replays.map(x=>x.metadata||{}),...choices].map(x=>(x.act||0)+':'+(x.floor||0)))].sort((a,b)=>{let x=a.split(':').map(Number),y=b.split(':').map(Number);return x[0]-y[0]||x[1]-y[1]});

function render(){let t=strings[lang];$('branchHelp').textContent=labels[lang].branchHelp;$('trendHelp').textContent=labels[lang].trendHelp;let losses=replays.map(lossOf).filter(Boolean).sort((a,b)=>b.v-a.v),worst=losses[0];document.documentElement.lang=lang;for(let [id,key] of Object.entries({title:'title',subtitle:'subtitle',timelineTitle:'timeline',trendsTitle:'trends',detailTitle:'detail',choicesTitle:'choices',combatTitle:'combat',prev:'prev',next:'next',restore:'restore'}))$(id).textContent=t[key];if(data.ai_run?.source==='ai')$('restore').textContent=aiLabels[lang].observe;clear('ai-run');if(data.ai_run?.source==='ai'){let a=data.ai_run,l=aiLabels[lang];line($('ai-run'),[l.source,l.seed+': '+(a.seed??'—'),l.character+': '+(a.character??'—'),l.ascension+': '+(a.ascension??'—'),l.outcome+': '+(a.outcome??'—')].join(' · '));if(a.summary)line($('ai-run'),l.summary+': '+a.summary);if(a.limitations?.length)line($('ai-run'),l.limitations+':\n'+a.limitations.join('\n'));} $('play').textContent=timer?t.pause:t.play;$('language').value=lang;$('run').textContent=data.run_id||'';clear('warnings');(data.warnings||[]).forEach(w=>line($('warnings'),t.warning+': '+w));clear('timeline');floors.forEach((f,i)=>{let c=cps.filter(x=>(x.act||0)+':'+(x.floor||0)===f),b=el('button',t.act+' '+f.split(':')[0]+' · '+t.floor+' '+f.split(':')[1]+'\n'+(c.map(x=>translated(x.room_type)).join(' / ')||t.unknown)+' · '+c.length+(worst&&(worst.m?.act||0)+':'+(worst.m?.floor||0)===f?' *':''),'floor'+(i===selected?' active':''));b.onclick=()=>{selected=i;combat=0;index=0;stop();render()};$('timeline').append(b)});
clear('trends');for(let [key,label] of [['hp',t.hp],['gold',t.gold],['deck_count',t.deck]]){let box=el('div',undefined,'card');box.append(el('strong',label));let svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 300 120');let points=cps.filter(x=>Number.isFinite(x[key])),max=Math.max(1,...points.map(x=>x[key])),path=[];points.forEach((x,i)=>{let px=points.length===1?150:10+i*280/(points.length-1),py=105-x[key]/max*90;path.push(px+','+py);let c=document.createElementNS(svg.namespaceURI,'circle');c.setAttribute('cx',px);c.setAttribute('cy',py);c.setAttribute('r','5');c.setAttribute('fill','#e9c980');let tip=document.createElementNS(svg.namespaceURI,'title');tip.textContent=x[key]+' · '+x.act+':'+x.floor;c.append(tip);c.onclick=()=>{selected=floors.indexOf((x.act||0)+':'+(x.floor||0));combat=0;index=0;stop();render()};svg.append(c)});let p=document.createElementNS(svg.namespaceURI,'polyline');p.setAttribute('points',path.join(' '));p.setAttribute('fill','none');p.setAttribute('stroke','#8b9df2');p.setAttribute('stroke-width','2');svg.prepend(p);box.append(svg,el('small',points.length?'0 – '+max:t.none));$('trends').append(box)}
